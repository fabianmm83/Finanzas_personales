<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas Personales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
   
   <style>
    /* Agregar estos estilos al CSS existente */
    
    /* Navbar en móviles - botones en línea */
    @media (max-width: 768px) {
        .navbar-nav {
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .navbar-nav .nav-item {
            margin: 0 5px;
        }
        
        .navbar-nav .nav-link {
            padding: 0.5rem;
            font-size: 0.8rem;
        }
        
        .navbar-nav .nav-link i {
            display: block;
            text-align: center;
            margin-bottom: 2px;
        }
        
        .navbar-nav .nav-link span {
            display: none;
        }
    }
    
    /* Logo más pequeño en móviles */
    @media (max-width: 576px) {
        .logo-img {
            height: 25px;
        }
        
        .navbar-brand span {
            font-size: 1rem;
        }
    }
</style>

</head>
<body>
    <!-- Barra de navegación fija -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="#" onclick="if(auth.currentUser) loadDashboard(auth.currentUser); return false;">
    <img src="/static/logo_torotech1.webp" alt="Logo ToroTech" class="logo-img" onerror="this.style.display='none'">
    <span>Finanzas Personales</span>
</a>
            
            <!-- Botón hamburguesa para móviles -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Menú de navegación -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="nav-home">
                            <i class="fas fa-home"></i> Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="nav-profile">
                            <i class="fas fa-user"></i> Perfil
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="nav-add-transaction">
                            <i class="fas fa-plus-circle"></i> Añadir Transacción
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="nav-logout" style="display: none;">
                            <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="nav-login" style="display: none;">
                            <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="toast-container" id="toast-container"></div>
    
    <div class="loading-spinner" id="loading-spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>
    
    <div class="container mt-4 mb-5">
        <div id="content">
            <div class="text-center py-5">
                <h1 class="text-primary">
                    <i class="fas fa-chart-line"></i><br>
                    Finanzas Personales
                </h1>
                <p class="lead">Cargando aplicación...</p>
            </div>
        </div>
    </div>

    <footer class="py-4 bg-dark text-white mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2024 Finanzas Personales. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-functions-compat.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- App Scripts -->
    <script src="/js/config.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/transactions.js"></script>
    <script src="/js/budgets.js"></script>
    <script src="/js/app.js"></script>
    
    <script>
        // Script para manejar el logo y errores de imagen
        document.addEventListener('DOMContentLoaded', function() {
            const logo = document.querySelector('.logo-img');
            if (logo) {
                logo.onerror = function() {
                    console.log('❌ Logo no encontrado en /static/logo_torotech1.webp');
                    this.style.display = 'none';
                };
                logo.onload = function() {
                    console.log('✅ Logo cargado correctamente');
                };
            }
            
            // Verificar que todos los elementos del navbar existen
            const navElements = [
                'nav-home', 'nav-profile', 'nav-add-transaction', 
                'nav-logout', 'nav-login'
            ];
            
            navElements.forEach(id => {
                const element = document.getElementById(id);
                console.log(`Nav element ${id}:`, element ? '✅' : '❌');
            });
        });
    </script>
</body>
</html>
